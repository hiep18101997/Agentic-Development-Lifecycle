name: Installer Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: install ${{ matrix.platform }} on ${{ matrix.os }} (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        platform: [claude, opencode, cursor, antigravity, codex, copilot]
        node: ['20', '16']
        exclude:
          - platform: opencode
            node: '16'
          - platform: cursor
            node: '16'
          - platform: antigravity
            node: '16'
          - platform: codex
            node: '16'
          - platform: copilot
            node: '16'

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm install --no-package-lock --no-audit --no-fund

      - name: Install into temp dir
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          flag=""
          case "${{ matrix.platform }}" in
            opencode)    flag="--opencode" ;;
            cursor)      flag="--cursor" ;;
            antigravity) flag="--antigravity" ;;
            codex)       flag="--codex" ;;
            copilot)     flag="--copilot" ;;
          esac
          cd "$tmp"
          node "$GITHUB_WORKSPACE/bin/install.js" --yes $flag
          echo "INSTALL_DIR=$tmp" >> "$GITHUB_ENV"

      - name: Verify output
        shell: bash
        run: |
          cd "$INSTALL_DIR"
          case "${{ matrix.platform }}" in
            claude)
              count=$(find .claude/skills -name "SKILL.md" | wc -l)
              test -f CLAUDE.md || { echo "FAIL: CLAUDE.md missing"; exit 1; }
              test -d agents   || { echo "FAIL: agents/ missing"; exit 1; }
              ;;
            opencode)
              count=$(find .opencode/skills -name "*.md" | wc -l)
              test -f AGENTS.md || { echo "FAIL: AGENTS.md missing"; exit 1; }
              ;;
            cursor)
              count=$(find .cursor/rules -name "*.mdc" | wc -l)
              stray=$(find .cursor/rules -name "*.md" | wc -l)
              test -f .cursorrules || { echo "FAIL: .cursorrules missing"; exit 1; }
              test "$stray" = "0"  || { echo "FAIL: $stray stray .md files (.cursor/rules should only contain .mdc)"; exit 1; }
              node "$GITHUB_WORKSPACE/scripts/validate-cursor-skills.js" .cursor/rules
              ;;
            antigravity)
              count=$(find .antigravity/skills -name "*.md" | wc -l)
              test -f AGENTS.md || { echo "FAIL: AGENTS.md missing"; exit 1; }
              node "$GITHUB_WORKSPACE/scripts/validate-antigravity-skills.js" .antigravity/skills
              ;;
            codex)
              count=$(find .agents/skills -mindepth 2 -maxdepth 2 -name "SKILL.md" | wc -l)
              test -f AGENTS.md || { echo "FAIL: AGENTS.md missing"; exit 1; }
              node "$GITHUB_WORKSPACE/scripts/validate-codex-skills.js" .agents/skills
              ;;
            copilot)
              count=$(find .github/skills -mindepth 2 -maxdepth 2 -name "SKILL.md" | wc -l)
              test -f .github/copilot-instructions.md || { echo "FAIL: .github/copilot-instructions.md missing"; exit 1; }
              node "$GITHUB_WORKSPACE/scripts/validate-codex-skills.js" .github/skills
              ;;
          esac
          count=$(echo "$count" | tr -d ' ')
          expected=105
          if [ "${{ matrix.platform }}" = "codex" ] || [ "${{ matrix.platform }}" = "copilot" ]; then expected=35; fi
          test "$count" = "$expected" || { echo "FAIL: found $count skill files (expected $expected)"; exit 1; }
          echo "OK: $count skill files installed for ${{ matrix.platform }} on ${{ matrix.os }}"
