name: Skill Triggering (OpenCode)

# Static, no-cost trigger-accuracy check for the OpenCode skill port — validates that each
# prompts/*.txt fixture actually contains a quoted trigger phrase from its target skill's
# description (tests/skill-triggering/opencode-run-test.ps1). This requires no API key and
# incurs no LLM cost, so it is safe to run on every push/PR.
#
# The Claude Code bash suite (tests/skill-triggering/run-all.sh) is intentionally NOT wired
# here — it drives a live authenticated `claude` CLI session per prompt and would consume real
# API credit on every CI run. Run it locally/manually per CLAUDE.md's "Testing skill triggering"
# section. Wiring it into CI is tracked as a follow-up if the repo owner provisions an
# ANTHROPIC_API_KEY secret and accepts the recurring cost.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trigger-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [vi, en, ja]
    # vi is a hard gate (100% pass, verified 2026-08-28). en/ja currently have real, pre-existing
    # trigger-phrase/prompt content mismatches surfaced by fixing this suite's language-file-selection
    # bug (see docs/improvement-backlog.md) — tracked as a follow-up backlog item, not re-blocked here
    # so the vi gate can ship without waiting on a full content-alignment pass across ~20 skills.
    continue-on-error: ${{ matrix.language != 'vi' }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Run OpenCode skill-triggering suite (${{ matrix.language }})
        shell: pwsh
        run: pwsh tests/skill-triggering/opencode-run-all.ps1 -Language ${{ matrix.language }}
